name: cidan
description: AI-powered regulatory compliance, circular ingestion, and policy validation engine for Flutter applications.
version: 1.0.4
homepage: https://github.com/ArjunJr05/cidan
repository: https://github.com/ArjunJr05/cidan
issue_tracker: https://github.com/ArjunJr05/cidan/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: '>=1.0.8 <3.0.0'
  file_picker: '>=11.0.3 <14.0.0'
  video_player: '>=2.9.2 <3.0.0'
  supabase_flutter: '>=2.18.3 <3.0.0'
  mailer: '>=7.2.0 <8.0.0'
  shared_preferences: '>=2.5.5 <3.0.0'
  path_provider: '>=2.1.5 <3.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assests/
    - assests/fonts/
    - assests/animation/
    - assests/videos/
    - assets/videos/
    - assests/Secure Banking Made Simple.png
    - assests/Verify Your Email with Cidan.png
    - assests/Regulatory Compliance AI Hero Banner.png
    - assests/Verified Bank Checklist.png
    - assests/Pastel Lavender Waves and Leaves.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assests/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assests/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assests/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assests/fonts/Poppins-Bold.ttf
          weight: 700
